[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
# the list is meant for future dependencies: do not flag licenses not yet encountered
unused-allowed-license = "allow"

[licenses.private]
# the workspace crates have `publish = false`: their license is checked by the manifest
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `path` dependencies inside the workspace are not wildcards
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "rustls is used instead" },
  { crate = "openssl-sys", reason = "rustls is used instead" },
  { crate = "native-tls", reason = "rustls is used instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
