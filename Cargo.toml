[workspace]
resolver = "3"
members = ["crates/frix-core", "crates/frix-mcp", "crates/frix-web", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpatariuRares/FrixMCP"
# MSRV: edition 2024 requires >= 1.85; rmcp 3.10.0 declares rust-version 1.88 (checked in its manifest).
rust-version = "1.88"

[workspace.dependencies]
# Every dependency has a `# why:` line and must pass `cargo deny check`.
# Candidate versions in docs/PROJECT.md §6.5; they are added here only when a crate uses them.
# why: library crate shared by the binaries (dependency rule, docs/PROJECT.md §6.1).
frix-core = { path = "crates/frix-core", version = "0.1.0" }
# why: event-based parsing of tr64desc.xml, SCPDs and SOAP responses (docs/PROJECT.md §6.5).
quick-xml = "0.42.0"
# why: FrixError with typed variants without boilerplate (docs/PROJECT.md §6.2).
thiserror = "2.0.21"
# why: official MCP SDK; server, macros and stdio only, no HTTP feature (docs/PROJECT.md §6.3).
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
# why: async runtime required by rmcp and the stdio transport.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "io-std"] }
# why: serialization of tool responses as structured JSON.
serde = { version = "1.0.229", features = ["derive"] }
# why: JSON of tool responses and of arguments in the MCP tests.
serde_json = "1.0.154"
# why: MD5 for HTTP Digest (RFC 2617), the TR-064 authentication (docs/PROJECT.md §5.1).
md-5 = "0.11.0"
# why: TLS to the router without OpenSSL; the pin needs a custom `ServerCertVerifier`
# (docs/PROJECT.md §7.4). `ring` provider: no cmake/aws-lc in the build.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# why: SHA-256 of the fingerprint and random cnonce; already in the graph as the rustls provider.
ring = "0.17.14"
# why: HTTP client of the real transport. Chosen with the criterion of docs/PROJECT.md §14.2.1
# (`cargo tree`, 2026-11-13): reqwest 0.13 + rustls = 83 crates (63 new for the workspace),
# ureq 3 + rustls = 21 (16 new). reqwest exceeds the ~80 threshold → ureq, synchronous,
# run in `spawn_blocking`. No features: ureq's TLS stays out; frix-core plugs in
# rustls with the pin through a `Connector` from ureq's `unversioned` API, hence `~3.5`.
ureq = { version = "~3.5.2", default-features = false }
# why: `config.toml` configuration file (host, Router Account, TLS) outside the repo.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# why: Router Account password as `SecretString`, never in `Debug` (docs/PROJECT.md §7.5).
secrecy = "0.10.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "warn"
indexing_slicing = "deny"
print_stdout = "deny"           # in frix-mcp stdout is the MCP channel
print_stderr = "warn"
dbg_macro = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
