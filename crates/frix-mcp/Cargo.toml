[package]
name = "frix-mcp"
description = "FrixMCP MCP server (stdio): read-only tools for the FRITZ!Box"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# why: TR-064 client and Policy; frix-mcp does not know about frix-web (docs/PROJECT.md §6.1).
frix-core.workspace = true
# why: MCP server on stdio with the tool macros.
rmcp.workspace = true
# why: async runtime of the MCP server.
tokio.workspace = true
# why: tool responses are structs serialized to JSON.
serde.workspace = true
# why: JSON of the tool responses.
serde_json.workspace = true
# why: the password read from the keyring stays a `SecretString` until the transport.
secrecy.workspace = true

[dev-dependencies]
# why: in-process MCP client for the tests (harness over an in-memory transport).
rmcp = { workspace = true, features = ["client"] }
# why: fake router with TLS in the startup tests over the real transport.
rustls.workspace = true
# why: independent check of the Digest header in the fake router.
md-5.workspace = true
