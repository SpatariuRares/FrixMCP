[package]
name = "frix-core"
description = "TR-064 client for FRITZ!Box with a read-only Policy (FrixMCP library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# why: parsing tr64desc.xml, SCPD and SOAP responses.
quick-xml.workspace = true
# why: parsing the mesh topology JSON (`X_AVM-DE_GetMeshListPath`, schema v8.7) and `config.toml`
# with `deny_unknown_fields` (no key ignored).
serde.workspace = true
# why: parsing the mesh topology JSON (`X_AVM-DE_GetMeshListPath`, schema v8.7).
serde_json.workspace = true
# why: FrixError, the domain error of frix-core.
thiserror.workspace = true
# why: HTTP Digest response (RFC 2617).
md-5.workspace = true
# why: Router Account password that cannot be printed.
secrecy.workspace = true
# why: pinned TLS to the router (docs/PROJECT.md §7.4).
rustls.workspace = true
# why: SHA-256 certificate fingerprint, cnonce and SHA-256 Digest hash (RFC 7616).
ring.workspace = true
# why: HTTP/1.1 client of the real transport to the router.
ureq.workspace = true
# why: the HTTP client is synchronous and runs in `spawn_blocking` behind the async interface.
tokio.workspace = true
# why: reading `config.toml`.
toml.workspace = true
# (the Policy tests also need tokio for async discovery on the FixtureTransport:
# it is already a normal dependency, so no line in [dev-dependencies].)
