[package]
name = "xtask"
description = "FrixMCP development commands: fixture recording and redaction, live test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Live test against the real router (`tests/live.rs`): reads only, credentials from the Keychain.
# Even with the feature the test is `#[ignore]`: it runs only with `-- --ignored` (docs/PROJECT.md §6.6).
live = []

[dependencies]
# why: real transport, Policy and classification of the recorded actions.
frix-core.workspace = true
# why: the command runs the reads through the real MCP tools (same parameters as the Agent)
# and reuses the `frix-mcp` config and flags.
frix-mcp = { path = "../crates/frix-mcp" }
# why: in-process MCP client to call the server's tools.
rmcp = { workspace = true, features = ["client"] }
# why: async runtime for the MCP client and the transport.
tokio.workspace = true
# why: tool arguments and redaction of the mesh JSON.
serde_json.workspace = true
# why: redaction of SOAP responses and XML lists, preserving their structure.
quick-xml.workspace = true
