name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    # una volta a settimana: nuovi advisory RustSec anche senza commit
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS è la piattaforma reale; Linux verifica che i test non-live non dipendano da macOS
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # azioni pinnate a commit, non a tag mobili
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup è preinstallato sui runner: legge rust-toolchain.toml (canale e componenti)
      - name: toolchain da rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # binario precompilato: cargo-deny-action gira in Docker e non funziona su macOS
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
